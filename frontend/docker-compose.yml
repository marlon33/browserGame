services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rpg_web
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
    networks:
      - rpg_frontend_net

networks:
  rpg_frontend_net:
    driver: bridge